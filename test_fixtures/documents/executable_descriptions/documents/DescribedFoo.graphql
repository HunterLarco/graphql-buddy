"""
Fetches a single foo by id.
"""
query DescribedFoo(
  "The id of the foo to fetch."
  $id: ID!
  "Whether to include the foo's name."
  $includeName: Boolean!
) {
  foo(id: $id) {
    ...DescribedFooFields
    name @include(if: $includeName)
  }
}

"""
The fields selected on a foo.
"""
fragment DescribedFooFields on Foo {
  id
}
